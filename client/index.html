<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jolt · Play. Get Better.</title>
    <!-- The theme, before the first paint, so nothing flashes the other one.
         Cream unless this device chose dusk (src/games/theme.ts). -->
    <script>
      (function () {
        var theme = "cream";
        try { if (localStorage.getItem("jolt.theme") === "dusk") theme = "dusk"; } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
